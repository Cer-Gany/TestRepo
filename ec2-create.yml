
AWSTemplateFormatVersion: '2010-09-09'

Description: Create EC2 Instance with Nginx Web Server

Parameters:
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

Resources:

  SimpleEC2Instance:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId

      SecurityGroupIds:
        - !Ref InstanceSecurityGroup

      Tags:
        - Key: Name
          Value: MySimpleInstance

      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y nginx
          systemctl start nginx
          systemctl enable nginx

          # Create a sample index.html file
          echo "<html>
          <head>
          <title>Welcome to Nginx on AWS</title>
          </head>
          <body>
          <h1>SAMPLE WEBPAGE Using CloudFormation</h1>
          <p>This is a sample webpage served by Nginx on an AWS EC2 instance.</p>
          </body>
          </html>" > /usr/share/nginx/html/index.html

  InstanceSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Enable HTTP access"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ElasticIP:
    Type: "AWS::EC2::EIP"
    Properties:
      InstanceId: !Ref SimpleEC2Instance

Outputs:
  InstancePublicIP:
    Description: Elastic IP Address
    Value: !Ref ElasticIP

  WebsiteURL:
    Description: Nginx Website URL
    Value: !Sub 'http://${ElasticIP}'
